apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-frontend
  labels:
    app: storefront
    tier: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: storefront
  template:
    metadata:
      labels:
        app: storefront
    spec:
      containers:
      - name: nginx-container
        image: nginx:1.25.1
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"
